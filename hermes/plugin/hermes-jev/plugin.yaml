name: hermes-jev
version: 0.3.4
description: TypeSafe Jev observes skill selection in shadow mode and can provide two advisory candidates without changing models, tools, or answers.
author: Steve Darlow
license: MIT
homepage: https://github.com/kerpopule/hermes-jev-skills
manifest_version: 2
requires_env:
  - TYPESAFE_API_KEY
provides_hooks:
  - pre_llm_call
tags: [jev, typesafe, skills, shadow]
config_schema:
  skills: {type: str, description: "off | shadow | on"}
